apiVersion: apps/v1
kind: Deployment
metadata:
  name: 09-cloud-fundamentals-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 09-cloud-fundamentals
  template:
    metadata:
      labels:
        app: 09-cloud-fundamentals
    spec:
      containers:
      - name: main-app
        image: myregistry.com/09-cloud-fundamentals:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
