apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 16-helm-ingress
spec:
  rules:
  - host: 16-helm.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 16-helm-service
            port:
              number: 80
