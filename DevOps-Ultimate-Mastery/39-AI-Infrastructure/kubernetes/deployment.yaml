apiVersion: apps/v1
kind: Deployment
metadata:
  name: 39-ai-infrastructure-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 39-ai-infrastructure
  template:
    metadata:
      labels:
        app: 39-ai-infrastructure
    spec:
      containers:
      - name: main-app
        image: myregistry.com/39-ai-infrastructure:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
