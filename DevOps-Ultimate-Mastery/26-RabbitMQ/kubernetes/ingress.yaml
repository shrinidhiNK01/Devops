apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 26-rabbitmq-ingress
spec:
  rules:
  - host: 26-rabbitmq.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 26-rabbitmq-service
            port:
              number: 80
