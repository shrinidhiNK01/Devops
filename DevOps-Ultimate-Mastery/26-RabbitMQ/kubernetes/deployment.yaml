apiVersion: apps/v1
kind: Deployment
metadata:
  name: 26-rabbitmq-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 26-rabbitmq
  template:
    metadata:
      labels:
        app: 26-rabbitmq
    spec:
      containers:
      - name: main-app
        image: myregistry.com/26-rabbitmq:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
