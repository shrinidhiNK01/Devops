apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 11-azure-ingress
spec:
  rules:
  - host: 11-azure.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 11-azure-service
            port:
              number: 80
