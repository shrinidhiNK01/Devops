apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 05-security-ingress
spec:
  rules:
  - host: 05-security.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 05-security-service
            port:
              number: 80
