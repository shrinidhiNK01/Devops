apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 25-kafka-ingress
spec:
  rules:
  - host: 25-kafka.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 25-kafka-service
            port:
              number: 80
