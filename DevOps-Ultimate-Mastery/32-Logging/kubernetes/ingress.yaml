apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 32-logging-ingress
spec:
  rules:
  - host: 32-logging.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 32-logging-service
            port:
              number: 80
