apiVersion: apps/v1
kind: Deployment
metadata:
  name: 08-python-for-devops-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 08-python-for-devops
  template:
    metadata:
      labels:
        app: 08-python-for-devops
    spec:
      containers:
      - name: main-app
        image: myregistry.com/08-python-for-devops:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
