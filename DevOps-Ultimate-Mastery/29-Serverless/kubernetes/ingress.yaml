apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 29-serverless-ingress
spec:
  rules:
  - host: 29-serverless.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 29-serverless-service
            port:
              number: 80
