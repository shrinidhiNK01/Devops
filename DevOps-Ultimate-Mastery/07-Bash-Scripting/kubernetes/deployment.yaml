apiVersion: apps/v1
kind: Deployment
metadata:
  name: 07-bash-scripting-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 07-bash-scripting
  template:
    metadata:
      labels:
        app: 07-bash-scripting
    spec:
      containers:
      - name: main-app
        image: myregistry.com/07-bash-scripting:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
