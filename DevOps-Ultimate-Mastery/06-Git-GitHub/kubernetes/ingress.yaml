apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 06-git-github-ingress
spec:
  rules:
  - host: 06-git-github.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 06-git-github-service
            port:
              number: 80
