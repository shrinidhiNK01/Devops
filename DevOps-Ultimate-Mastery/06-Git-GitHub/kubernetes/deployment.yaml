apiVersion: apps/v1
kind: Deployment
metadata:
  name: 06-git-github-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 06-git-github
  template:
    metadata:
      labels:
        app: 06-git-github
    spec:
      containers:
      - name: main-app
        image: myregistry.com/06-git-github:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
