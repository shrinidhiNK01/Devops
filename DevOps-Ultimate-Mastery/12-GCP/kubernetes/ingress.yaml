apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 12-gcp-ingress
spec:
  rules:
  - host: 12-gcp.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 12-gcp-service
            port:
              number: 80
