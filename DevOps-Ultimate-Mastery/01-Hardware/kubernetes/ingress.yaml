apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 01-hardware-ingress
spec:
  rules:
  - host: 01-hardware.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 01-hardware-service
            port:
              number: 80
