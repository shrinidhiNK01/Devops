apiVersion: apps/v1
kind: Deployment
metadata:
  name: 37-databases-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 37-databases
  template:
    metadata:
      labels:
        app: 37-databases
    spec:
      containers:
      - name: main-app
        image: myregistry.com/37-databases:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
