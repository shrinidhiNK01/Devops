apiVersion: apps/v1
kind: Deployment
metadata:
  name: 02-operating-systems-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: 02-operating-systems
  template:
    metadata:
      labels:
        app: 02-operating-systems
    spec:
      containers:
      - name: main-app
        image: myregistry.com/02-operating-systems:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
